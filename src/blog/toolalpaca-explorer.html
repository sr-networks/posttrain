.gridline { position: absolute; pointer-events: none; background: #dbe5ec; }
.x-grid { width: 1px; height: 100%; }
.y-grid { height: 1px; width: 100%; }
.tick { position: absolute; color: #536673; font-size: .78rem; pointer-events: none; font-variant-numeric: tabular-nums; }

.single .symbol { background: color-mix(in srgb, var(--method) 57%, white); }
.point[data-ranked] .symbol { width: var(--marker-size); }

.segment.paired-direct { border-top-style: dashed; }
.details { padding: 1rem 1.1rem 1.15rem; }
.details h2 { font-size: 1.06rem; margin: 0 0 .45rem; }
.details h3 { font-size: 1.3rem; margin: .3rem 0; line-height: 1.2; }
.subline, .meta, .legend { color: #526573; font-size: .875rem; }
.subline { margin: .2rem 0 .75rem; }
.metrics { display: grid; grid-template-columns: 1fr 1fr; gap: .65rem; padding: .7rem 0; border-block: 1px solid #d9e3eb; margin-bottom: .75rem; }
.metrics div, .params div { min-width: 0; }
.metrics small, .params dt { display: block; color: #526573; font-size: .78rem; }
.metrics strong { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.params { display: grid; grid-template-columns: 1fr 1fr; gap: .45rem .65rem; margin: 0; }
.params dd { margin: 0; font-weight: 600; }
.meta { margin: .65rem 0 0; }
.legend { margin: .65rem 0 0 .15rem; }
.rank-key { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .85rem; margin: .35rem 0 0 .15rem; }
.rank-example { display: inline-flex; align-items: center; gap: .35rem; font-variant-numeric: tabular-nums; }
.rank-example .symbol { width: var(--marker-size); }
.nearby { margin-top: .75rem; display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
.nearby button { background: #f3f7fa; border: 1px solid #a7b7c4; border-radius: .35rem; padding: .24rem .45rem; font-size: .8rem; }
.nearby[hidden], .tip[hidden], .point[hidden] { display: none; }
.tip { position: absolute; z-index: 6; pointer-events: none; background: #152737; color: white; border-radius: .42rem; padding: .48rem .65rem; font-size: .78rem; max-width: 17rem; box-shadow: 0 2px 8px #101b2e36; }

1005, "count": 1}, {"method": "mica-direct", "rank": 128, "alpha": 128, "lr": 0.0004, "epochs": 2, "accuracy": 69.0721649484536, "retention": 61.063851592538036, "seed": 1006, "count": 1}, {"method": "mica-direct", "rank": 128, "alpha": 128, "lr": 0.0004, "epochs": 2, "accuracy": 68.04123711340206, "retention": 61.29471543017996, "seed": 1007, "count": 1}, {"method": "mica-direct", "rank": 128, "alpha": 128, "lr": 0.0004, "epochs": 2, "accuracy": 67.01030927835052, "retention": 61.63441276463526, "seed": 1008, "count": 1}, {"method": "lora-direct", "rank": 128, "alpha": 128, "lr": 0.0008, "epochs": 2, "accuracy": 71.1340206185567, "retention": 59.971820370326284, "seed": 1001, "count": 1}, {"method": "lora-direct", "rank": 128, "alpha": 128, "lr": 0.0008, "epochs": 2, "accuracy": 65.97938144329896, "retention": 59.343238364730325, "seed": 1002, "count": 1}, {"method": "lora-direct", "rank": 128, "alpha": 128, "lr": 0.0008, "epochs": 2, "accuracy": 64.94845360824742, "retention": 58.408854837363194, "seed": 1003, "count": 1}, {"method": "lora-direct", "rank": 128, "alpha": 128, "lr": 0.0008, "epochs": 2, "accuracy": 65.97938144329896, "retention": 60.076219548470306, "seed": 1004, "count": 1}, {"method": "lora-direct", "rank": 128, "alpha": 128, "lr": 0.0008, "epochs": 2, "accuracy": 70.10309278350516, "retention": 60.360729691111835, "seed": 1005, "count": 1}, {"method": "lora-direct", "rank": 128, "alpha": 128, "lr": 0.0008, "epochs": 2, "accuracy": 71.1340206185567, "retention": 59.39126735309042, "seed": 1006, "count": 1}, {"method": "lora-direct", "rank": 128, "alpha": 128, "lr": 0.0008, "epochs": 2, "accuracy": 71.1340206185567, "retention": 58.608948256530525, "seed": 1007, "count": 1}, {"method": "lora-direct", "rank": 128, "alpha": 128, "lr": 0.0008, "epochs": 2, "accuracy": 67.01030927835052, "retention": 59.19696927155714, "seed": 1008, "count": 1}, {"method": "mica-direct", "rank": 128, "alpha": 128, "lr": 0.0001, "epochs": 2, "accuracy": 65.97938144329896, "retention": 63.199074581976014, "seed": 1001, "count": 1}, {"method": "mica-direct", "rank": 128, "alpha": 128, "lr": 0.0008, "epochs": 2, "accuracy": 67.0103092783505, "retention": 59.121797393084464, "seed": 1001, "count": 1}, {"method": "mica-direct", "rank": 32, "alpha": 32, "lr": 0.0002, "epochs": 2, "accuracy": 67.0103092783505, "retention": 63.38699709767539, "seed": 1001, "count": 1}, {"method": "mica-direct", "rank": 32, "alpha": 32, "lr": 0.0004, "epochs": 2, "accuracy": 65.97938144329896, "retention": 62.537079569074145, "seed": 1001, "count": 1}, {"method": "mica-direct", "rank": 32, "alpha": 32, "lr": 0.0008, "epochs": 2, "accuracy": 62.88659793814433, "retention": 62.28966601326772, "seed": 1001, "count": 1}, {"method": "mica-direct", "rank": 64, "alpha": 64, "lr": 0.0001, "epochs": 2, "accuracy": 67.0103092783505, "retention": 63.462360259086076, "seed": 1001, "count": 1}, {"method": "mica-direct", "rank": 64, "alpha": 64, "lr": 0.0002, "epochs": 2, "accuracy": 63.91752577319587, "retention": 62.81770401742914, "seed": 1001, "count": 1}, {"method": "mica-direct", "rank": 64, "alpha": 64, "lr": 0.0004, "epochs": 2, "accuracy": 65.97938144329896, "retention": 62.50413810846077, "seed": 1001, "count": 1}, {"method": "mica-direct", "rank": 64, "alpha": 64, "lr": 0.0008, "epochs": 2, "accuracy": 64.94845360824742, "retention": 61.75871853161054, "seed": 1001, "count": 1}], "methods": {"mica-direct": ["MiCA", "#0072b2"], "lora-direct": ["LoRA", "#b44434"], "full-ft": ["Full fine-tuning", "#161616"], "paired-direct": ["Paired MiCA", "#0072b2"], "unadapted": ["Unadapted Instruct", "#172437"]}, "frontiers": {}}</script>
<script>
"use strict";
const {points, methods, frontiers} = JSON.parse(document.getElementById("chart-data").textContent);
const area = document.getElementById("area");
const chart = document.getElementById("chart");
const tip = document.getElementById("tip");
const details = document.getElementById("details");
const nearby = document.getElementById("nearby");
const count = document.getElementById("nearby-count");
const enabled = new Set(Object.keys(methods));
const number = new Intl.NumberFormat("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const bounds = {
  left: Math.floor(Math.min(...points.map(p => p.accuracy)) / 5) * 5 - .7,
  right: Math.max(...points.map(p => p.accuracy)) + 1.4,
  bottom: Math.min(...points.map(p => p.retention)) - .65,
  top: Math.max(...points.map(p => p.retention)) + .55
};
let focusedPoint = null;
let pinnedPoint = null;
let neighbors = [];
const position = {
  x: val => (val - bounds.left) / (bounds.right - bounds.left),
  y: val => (bounds.top - val) / (bounds.top - bounds.bottom)
};
const pct = val => number.format(val) + "%";
const lr = val => val === null ? "—" : val.toExponential().replace("e+", "e");
const type = p => p.count === 0 ? "Reference" : "Seed " + p.seed;
const rankSize = rank => (.54 + .115 * Math.log2(rank / 16)) + "rem";

function node(tag, className, text) {
  const element = document.createElement(tag);
  element.className = className;
  if (text !== undefined) element.textContent = text;
  return element;
}

function mark(element, p) {
  element.style.left = position.x(p.accuracy) * 100 + "%";
  element.style.top = position.y(p.retention) * 100 + "%";
}

function select(p, pin = false) {
  if (pin) pinnedPoint = p;
  focusedPoint = p;
  details.replaceChildren(node("h3", "", methods[p.method][0]), node("p", "subline", type(p)));
  const metrics = node("div", "metrics");
  for (const [label, value] of [["Accuracy", p.accuracy], ["Retention", p.retention]]) {
    const entry = node("div", "");
    entry.append(node("small", "", label), node("strong", "", pct(value)));
    metrics.append(entry);
  }
  details.append(metrics);
  const parameters = node("dl", "params");
  for (const [label, value] of [["Learning rate", lr(p.lr)], ["Epochs", p.epochs], ["Rank", p.rank], ["Alpha", p.alpha]]) {
    const entry = node("div", "");
    entry.append(node("dt", "", label), node("dd", "", value ?? "—"));
    parameters.append(entry);
  }
  details.append(parameters);
  if (p.job) details.append(node("p", "meta", "Slurm job " + p.job));
  if (pin) {
    neighbors = [p, ...points.filter(other => other !== p && enabled.has(other.method) &&
      Math.hypot((position.x(other.accuracy) - position.x(p.accuracy)) * area.clientWidth,
        (position.y(other.retention) - position.y(p.retention)) * area.clientHeight) < 15)];
  }
  nearby.hidden = !pin || neighbors.length < 2;
  count.textContent = neighbors.length + " nearby points";
  for (const marker of markers) marker.setAttribute("aria-pressed", String(marker.point === pinnedPoint));
}

function hover(marker, p) {
  select(p);
  tip.replaceChildren(node("strong", "", methods[p.method][0] + " · " + type(p)),
    node("div", "", pct(p.accuracy) + " Accuracy · " + pct(p.retention) + " Retention"));
  if (p.count) tip.append(node("div", "", "LR " + lr(p.lr) + " · " + p.epochs +
    " Epochs" + (p.rank === null ? "" : " · Rank " + p.rank + " · α " + p.alpha)));
  tip.hidden = false;
  const left = area.offsetLeft + marker.offsetLeft;
  const top = area.offsetTop + marker.offsetTop;
  tip.style.left = Math.max(8, Math.min(left + 12, chart.clientWidth - tip.offsetWidth - 8)) + "px";
  tip.style.top = Math.max(5, top - tip.offsetHeight - 7) + "px";
}

function leave() {
  tip.hidden = true;
  if (pinnedPoint) {
    const choices = neighbors;
    select(pinnedPoint);
    neighbors = choices;
    nearby.hidden = neighbors.length < 2;
  }
}

function ticks(start, end, step, axis) {
  for (let v = Math.ceil(start / step) * step; v <= end; v += step) {
    const grid = node("div", "gridline " + axis + "-grid");
    const tick = node("span", "tick " + axis + "-tick", v);
    const property = axis === "x" ? "left" : "top";
    grid.style[property] = tick.style[property] = position[axis](v) * 100 + "%";
    grid.setAttribute("aria-hidden", "true");
    tick.setAttribute("aria-hidden", "true");
    area.append(grid, tick);
  }
}
ticks(bounds.left, bounds.right, 5, "x");
ticks(bounds.bottom, bounds.top, 2, "y");

const markers = points.map(p => {
  const marker = node("button", "point " + p.method + (p.count ? " single" : ""));
  marker.type = "button";
  marker.point = p;
  marker.style.setProperty("--method", methods[p.method][1]);
  if (p.rank !== null) {
    const size = rankSize(p.rank);
    marker.dataset.ranked = "";
    marker.style.setProperty("--marker-size", size);
    marker.style.width = marker.style.height = "max(1.15rem, calc(" + size + " + .3rem))";
  }
  marker.setAttribute("aria-label", methods[p.method][0] + ", " + type(p) + ", Accuracy " +
    pct(p.accuracy) + ", Retention " + pct(p.retention) +
    (p.count ? ", Learning rate " + lr(p.lr) + ", Epochs " + p.epochs +
      (p.rank === null ? "" : ", Rank " + p.rank + ", Alpha " + p.alpha) : ""));
  marker.setAttribute("aria-pressed", "false");
  marker.append(node("span", "symbol"));
  mark(marker, p);
  marker.addEventListener("mouseenter", () => hover(marker, p));
  marker.addEventListener("focus", () => hover(marker, p));
  marker.addEventListener("mouseleave", leave);
  marker.addEventListener("blur", leave);
  marker.addEventListener("click", () => { select(p, true); tip.hidden = true; });
  area.append(marker);
  return marker;
});

function drawFrontiers() {
  area.querySelectorAll(".segment").forEach(element => element.remove());
  for (const [method, curve] of Object.entries(frontiers)) {
    if (!enabled.has(method)) continue;
    for (let i = 1; i < curve.length; i++) {
      const [x, y] = curve[i - 1], [nextX, nextY] = curve[i];
      const dx = (position.x(nextX) - position.x(x)) * area.clientWidth;
      const dy = (position.y(nextY) - position.y(y)) * area.clientHeight;
      const segment = node("span", "segment " + method);
      segment.style.setProperty("--method", methods[method][1]);
      segment.style.width = Math.hypot(dx, dy) + "px";
      segment.style.transform = "rotate(" + Math.atan2(dy, dx) + "rad)";
      mark(segment, {accuracy: x, retention: y});
      area.prepend(segment);
    }
  }
}
new ResizeObserver(drawFrontiers).observe(area);

const legend = document.getElementById("legend");
function applyFilters() {
  markers.forEach(marker => { marker.hidden = !enabled.has(marker.point.method); });
  if (pinnedPoint && !enabled.has(pinnedPoint.method)) pinnedPoint = null;
  if (focusedPoint && !enabled.has(focusedPoint.method)) {
    focusedPoint = pinnedPoint = null;
    details.replaceChildren(node("p", "subline", "Select a point on the chart."));
    nearby.hidden = tip.hidden = true;
  }
  drawFrontiers();
  const visible = points.filter(p => enabled.has(p.method)).length;
  legend.textContent = visible + " points · Each filled marker is one run" +
    (Object.keys(frontiers).length ? " · Lines show the shared-grid Pareto frontiers" : "");
}

for (const [method, [label, color]] of Object.entries(methods)) {
  const filter = node("button", "filter " + method);
  filter.type = "button";
  filter.setAttribute("aria-pressed", "true");
  filter.style.setProperty("--method", color);
  filter.append(node("span", "symbol"), document.createTextNode(label));
  filter.addEventListener("click", () => {
    if (enabled.has(method)) enabled.delete(method);
    else enabled.add(method);
    filter.setAttribute("aria-pressed", String(enabled.has(method)));
    applyFilters();
  });
  document.getElementById("filters").append(filter);
}
for (const rank of [16, 32, 64, 128, 256]) {
  const example = node("span", "rank-example mica-direct");
  example.style.setProperty("--marker-size", rankSize(rank));
  example.style.setProperty("--method", methods["mica-direct"][1]);
  const symbol = node("span", "symbol");
  symbol.setAttribute("aria-hidden", "true");
  example.append(symbol, document.createTextNode(rank));
  document.getElementById("rank-key").append(example);
}
for (const [id, delta] of [["previous", -1], ["next", 1]]) {
  document.getElementById(id).addEventListener("click", () => {
    const index = (neighbors.indexOf(focusedPoint) + delta + neighbors.length) % neighbors.length;
    const choices = neighbors;
    select(neighbors[index], true);
    neighbors = choices;
    count.textContent = (index + 1) + " of " + choices.length + " nearby points";
  });
}
applyFilters();
</script>
